 apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 37
    defaultConfig {
        applicationId "org.c_base.c_beam"
        minSdkVersion 25
        targetSdkVersion 37
        versionCode 39
        versionName "26.08.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            android.lintOptions.abortOnError = false
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'        }
    }

    flavorDimensions "gcm"

    productFlavors {
        withGCM {
            dimension "gcm"
        }

        noGCM {
            dimension "gcm"
        }
    }
    namespace 'org.c_base.c_beam'
}

dependencies {
    implementation 'com.androidplot:androidplot-core:1.5.11'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.mcxiaoke.viewpagerindicator:library:2.4.1@aar'
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'com.madgag.spongycastle:pkix:1.54.0.0'
    implementation 'com.thetransactioncompany:jsonrpc2-base:2.2.1'
    implementation 'com.thetransactioncompany:jsonrpc2-client:2.1.1'
    //implementation "com.google.android.gms:play-services-gcm:8.4.0"
    implementation('org.eclipse.paho:org.eclipse.paho.android.service:1.1.1') {
        exclude module: 'support-v4'
    }
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
        withGCMImplementation 'com.google.firebase:firebase-messaging:25.1.2'
}

