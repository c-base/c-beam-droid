 apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 37
    defaultConfig {
        applicationId "org.c_base.c_beam"
        minSdkVersion 25
        targetSdkVersion 37
        versionCode 39
        versionName "26.09.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Deliberately no signingConfig: a release APK built from the command line is
            // unsigned and fails to install, instead of quietly carrying the debug key.
            // Releases are signed through the IDE's wizard with the c-base key.
            android.lintOptions.abortOnError = false
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'        }
    }

    flavorDimensions "gcm"

    productFlavors {
        withGCM {
            dimension "gcm"
        }

        noGCM {
            dimension "gcm"
        }
    }
    namespace 'org.c_base.c_beam'

    packaging {
        resources {
            // Netty ships these in several jars; required by the HiveMQ client on Android.
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

// The Gradle daemon may run on a JRE-only JDK (Java 25 here has no compiler); pin the
// compilation toolchain so the build no longer depends on a hand-set JAVA_HOME. The
// foojay resolver in settings.gradle locates or provisions a matching JDK.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// The google-services plugin has no per-flavor switch, so keep it from running for the
// F-Droid flavor: noGCM has no Firebase dependency and must not embed the Firebase
// project config as string resources. The withGCM tasks are untouched.
tasks.configureEach { task ->
    if (task.name.startsWith('processNoGCM') && task.name.endsWith('GoogleServices')) {
        task.enabled = false
    }
}

dependencies {
    // Reverted from 1.5.11 on 2026-09-05: 1.x crashed on the 0.6-era androidPlot.* layout
    // attributes and, once those were removed, rendered the c-corder plots empty even
    // though sensor data was arriving. Migrating to 1.x is tracked in CODE-AUDIT.md.
    implementation 'com.androidplot:androidplot-core:0.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.mcxiaoke.viewpagerindicator:library:2.4.1@aar'
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'com.madgag.spongycastle:pkix:1.54.0.0'
    implementation 'com.thetransactioncompany:jsonrpc2-base:2.2.1'
    implementation 'com.thetransactioncompany:jsonrpc2-client:2.1.1'
    //implementation "com.google.android.gms:play-services-gcm:8.4.0"
    // Replaced org.eclipse.paho.android.service 1.1.1 on 2026-09-08: its AlarmPingSender
    // registers a receiver without an export flag and crashes the process on connect from
    // targetSdk 34. HiveMQ is on Maven Central, actively maintained, speaks MQTT 3.1.1 now
    // and 5 later. It is a plain Java client, so the long-lived connection lives in our own
    // MqttForegroundService (noGCM flavor).
    implementation 'com.hivemq:hivemq-mqtt-client:1.4.0'
        withGCMImplementation 'com.google.firebase:firebase-messaging:25.1.2'
}

